<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<title>Tebrikler! Bir Date Teklifi Kazandınız</title>
<style>
    body {
        background: #000;
        color: white;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow-x: hidden;
    }
    
    .box {
        margin-bottom: 20px;
        font-family: "Segoe UI", sans-serif;
    }

    @keyframes color {
        0% { background-position: 0% 50%; }
        100% { background-position: 100% 50%; }
    }

    h3 {
        font-size: clamp(24px, 4vw, 40px);
        font-weight: 700;
        color: transparent;
        background: linear-gradient(
            90deg,
            rgba(255, 0, 0, 1) 0%,
            rgba(238, 100, 10, 1) 14%,
            rgba(234, 252, 62, 1) 28%,
            rgba(134, 248, 82, 1) 42%,
            rgba(75, 216, 237, 1) 56%,
            rgba(126, 45, 244, 1) 70%,
            rgba(251, 103, 164, 1) 84%,
            rgba(255, 0, 191, 1) 100%
        );
        background-clip: text;
        -webkit-background-clip: text;
        background-size: 200%;
        animation: color 3s linear infinite;
        text-align: center;
    }

    /* Resim Düzenlemesi */
    .hero-img {
        max-width: 90%;
        width: 600px;
        height: auto;
        border-radius: 15px;
        box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
    }

    /* Buton Grubu */
    .btn-container {
        display: flex;
        gap: 20px;
        justify-content: center;
        align-items: center;
        margin-top: 30px;
        position: relative;
        width: 100%;
        min-height: 60px;
    }

    .evet-btn {
        background: #fff;
        color: rgb(180, 20, 20);
        font-weight: bold;
        padding: 10px 30px;
        border-radius: 10px;
        text-decoration: none;
    }

    .kacan-buton {
        position: relative;
        transition: all 0.15s ease;
    }
</style>
</head>
<body>

    <div class="box">
        <h3>Benimle Date'e Çıkar mısın?</h3>
    </div>

    <!-- Fotoğraf Alanı -->
    <img src="simsek.jpg" alt="Şimşek McQueen" class="hero-img">

    <!-- Butonlar -->
    <div class="btn-container">
        <a href="sayfa2.html" class="evet-btn">
            <h2 class="m-0">EVET</h2>
        </a>

        <div class="kacan-buton" id="noBtn" onmouseover="kac()" onclick="kac()">
            <button type="button" class="btn btn-danger"><h2>HAYIR</h2></button>
        </div>
    </div>

<script>
function kac() {
    var btn = document.getElementById("noBtn");
    var x = Math.random() * (window.innerWidth - btn.clientWidth - 40);
    var y = Math.random() * (window.innerHeight - btn.clientHeight - 40);
    
    btn.style.position = "fixed";
    btn.style.left = Math.max(20, x) + 'px';
    btn.style.top = Math.max(20, y) + 'px';
}
</script>

</body>
</html>
